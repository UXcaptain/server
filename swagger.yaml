components:
  schemas:  
    SuccessTrueStatus:
      description: Success status for any API call
      type: boolean
      example: true

    SuccessFalseStatus:
      description: false status for any API call
      type: boolean
      example: false

    UserId:
      description: The unique identifier of a user
      type: string
      format: uuid
      examples: [
          "0464ac85-e565-4d44-bde7-d6de0aa358ea",
        ]

    AnalysisId:
        description: The unique identifier of an analysis
        type: string
        format: uuid
        examples: [
          "0464ac85-e565-4d44-bde7-d6de0aa358ea",
        ]
    
    AnalysisEntryId:
        description: The unique identifier of an entry
        type: string
        format: uuid
        examples: [
          "d7c8843e-b500-45be-a3e6-7f2d3c33ae13"
        ]
    
    UserRoles:
      type: string
      enum: [customer, admin, participant]
      description: role assigned to user
      examples: [
        customer,
        admin,
        participant
      ]
    
    CacheTTL_seconds:
      type: string
      default: 60
      description: time in seconds for cache to expire - * Returned only if cache is used
      examples: [
        60
      ]

    CacheKey:
      type: string
      description: unique identifier for cache entry - * Returned only if cache is used
      examples: [
        "allUsers-{\"role\":\"customer\"}-all",
        "userId-5586eab9-e25c-48b6-a3c9-73a567218b81",
      ]

    ValidationErrors:
      type: object
      properties:
        type:
          type: string
          example: field
        value:
          type: string
          example: [ REDACTED ]
        msg:
          type: string
          example: Username is required
        path:
          type: string
          example: username
        location:
          type: string
          example: body

    CustomerProfile:
      type: object
      properties:
        email:
          $ref: "#/components/schemas/UserEmail"
        role:
          $ref: "#/components/schemas/UserRoles"
        
    ParticipantProfile:
      type: object
      properties:
        email:
          $ref: "#/components/schemas/UserEmail"
        role:
          $ref: "#/components/schemas/UserRoles"
    
    CreatedAt:
      type: string
      description: Date of creation
      examples: [
        2025-05-15T14:23:21.303Z
      ]

    UpdatedAt:
      type: string
      description: The date of update
      examples: [
        2025-05-15T14:23:21.303Z
      ]

    LastLoginAt:
      type: string
      description: The last login time of the user
      examples: [
        2025-05-15T14:23:21.303Z
      ]

    StripeId:
      type: string
      description: The Stripe customer ID associated with the company
      examples: [
        cus_SWWUxsoPPQnVSb,
        cus_HvgQzGHkJLqERn,
      ]

    Analysis:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/AnalysisId'
        device:
          $ref: '#/components/schemas/AnalysisDevice'
        name:
          $ref: '#/components/schemas/AnalysisName'
        url:
          $ref: '#/components/schemas/AnalysisUrl'
        status:
          $ref: '#/components/schemas/AnalysisStatus'
        maxNumberOfParticipants:
          $ref: '#/components/schemas/AnalysisMaxNumberOfParticipants'
        created_at:
          $ref: '#/components/schemas/CreatedAt'

    AnalysisWithCount:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/AnalysisId'
        device:
          $ref: '#/components/schemas/AnalysisDevice'
        name:
          $ref: '#/components/schemas/AnalysisName'
        url:
          $ref: '#/components/schemas/AnalysisUrl'
        status:
          $ref: '#/components/schemas/AnalysisStatus'
        max_number_of_participants:
          $ref: '#/components/schemas/AnalysisMaxNumberOfParticipants'
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        _count: 
          $ref: '#/components/schemas/AnalysisEntriesCount'
        

    AnalysisWithEntryDetails:
      type: object
      properties:
        owner_id:
          $ref: '#/components/schemas/UserId'
        device:
          $ref: '#/components/schemas/AnalysisDevice'
        name:
          $ref: '#/components/schemas/AnalysisName'
        scenario:
          $ref: '#/components/schemas/AnalysisScenario'
        tasks:
          $ref: '#/components/schemas/AnalysisTasksArray'
        url:
          $ref: '#/components/schemas/AnalysisUrl'
        status:
          $ref: '#/components/schemas/AnalysisStatus'
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        id: 
          $ref: '#/components/schemas/AnalysisId'
        max_number_of_participants:
          $ref: '#/components/schemas/AnalysisMaxNumberOfParticipants'
        AnalysisEntry:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisEntryWithParticipant'

    AnalysisEntryUrl:
      type: string
      format: url
      description: The URL of the completed entry
      examples: [
        'https://www.storage.com/1234'
      ]

    AnalysisEntry:
      type: object
      description: The details of a completed entry for an analysis
      properties:
        id: 
          $ref: '#/components/schemas/AnalysisEntryId'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'

    AnalysisEntryWithParticipant:
      type: object
      description: The details of a completed entry for an analysis with participant data
      properties:
        id: 
          $ref: '#/components/schemas/AnalysisEntryId'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'        

    AnalysisName:
      type: string
      description: The title of the analysis - Helps the user differentiate between their analysis
      examples: [
        'Landing page analysis',
        'Figma Prototype analysis'
      ]

    AnalysisMaxNumberOfParticipants:
      type: number
      description: The maximum number of participants that can join
      examples: [
        10,
      ]          

    AnalysisTasksArray:
      description: An array of analysis tasks that make up the analysis
      type: array
      items:
        $ref: "#/components/schemas/AnalysisTasks"

    AnalysisTasks:
      type: object
      properties:
        taskType:
          $ref: "#/components/schemas/AnalysisTaskType"
        taskContent:
          $ref: "#/components/schemas/AnalysisTaskContent"

    AnalysisTaskContent:
      type: string
      description: The content of the task that the participants should complete
      examples: [
        'Search for a hand bag in this website',
        'Without clicking on anything - Share your thoughts on what this website does',
        'Try to find the return policy of this website'
      ]

    AnalysisTaskType:
      type: string
      description: The type of the task being created
      enum: [text]

    AnalysisDevice:
      type: string
      enum: [computer, mobile, tablet, other]
      description: The device that the participants should complete the analysis on
      example: computer
    
    AnalysisStatus:
      type: string
      default: published
      enum: [draft, published, completed]
      description: The status of the analysis

    AnalysisUrl:
      type: string
      format: url
      examples: [
        'https://www.siteToAnalyze.com',
        'https://www.figma-prototype.com'
      ]
      description: The url of the site the user must visit

    AnalysisScenario:
      type: string
      default: ''
      examples: [
        'Imagine you are buying a house and your budget is 5000€',
        'Imagine its your brothers birthday and you want to gift him a dog leash with a price tag of 50€ or less'
      ]
      description: The scenario the user must adopt while completing the analysis
    
    AnalysisEntryCompletionStatus:
      type: string
      default: submitted
      enum: [in_progress, cancelled, submitted, accepted, rejected]
      description: The status of the analysis entry
    
    UserEmail:
      type: string
      description: The email address of the user
      examples: [
        username@gmail.com
      ]

    UserPassword:
      type: string
      format: password
      description: user password
      example: 123456

    PasswordResetToken:
      type: string
      format: uuid
      description: Token for restoring password
      examples: [
        9f4398c9-c049-40dd-85f7-28d04eb7b3ae
      ]

    StripeSubscriptionId:
      type: string
      description: The Stripe subscription ID associated with a user's subscription
      examples: [
        sub_1ReNIs4EThrTH3Et8fmPxMXe
      ]

    AnalysisEntriesCount: 
      type: object
      description: the number of analysis entries in a given analysis
      properties: 
        AnalysisEntry:
          type: number
          examples: [
            1,
            2,
            3,
          ]

    CompanySubscriptionData:
      type: object
      properties:
        Subscription:
          type: array
          items:
            type: object
            properties:
              id:
                $ref: '#/components/schemas/StripeSubscriptionId'
              expires_at:
                $ref: '#/components/schemas/ExpirationDate'

    BillingPlanBillingCycle:
      type: string
      description: Indicates the renewal frequency of the billing plan
      examples: [
        monthly,
        biannual,
        annual        
      ]

    BillingPlanName:
      type: string
      description: Indicates the name of the billing plan
      examples: [
        free,
        basic,
        pro,
        enterprise
      ]


    ExpirationDate:
      type: string
      description: date of the expiration
      examples: [
        '2025-10-22 09:46:56.655',
      ]

    AnalysisEntryPresignedUploadUrl:
      type: string
      format: url
      description: Indicates the presigned PUT S3 URL that the client can use to upload the completed analysis entry - Has a validity of 90 minutes
      examples: [
          https://dev-analysis-entry-storage.s3.eu-west-3.amazonaws.com/analysis/e1e0c675-179b-453e-9d4f-226eb0ddcd6b/068b2e8b-025a-4eb5-8fe0-4197e48e733d/068b2e8b-025a-4eb5-8fe0-4197e48e733d?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Credential=AKIAQTEOOHOGGDJ5YJFY%2F20251025%2Feu-west-3%2Fs3%2Faws4_request&X-Amz-Date=20251025T151537Z&X-Amz-Expires=900&X-Amz-Signature=9d6f48b6a913b424ef4ba59bf050e865110592f5a9708070a54c399783208502&X-Amz-SignedHeaders=host&x-amz-checksum-crc32=AAAAAA%3D%3D&x-amz-sdk-checksum-algorithm=CRC32&x-id=PutObject
      ]

    AnalysisEntryGetRecordingPresignedUrl:
      type: string
      format: url
      description: Indicates the presigned GET S3 URL that the client can use to view the completed analysis entry
      examples: [
          https://dev-analysis-entry-storage.s3.eu-west-3.amazonaws.com/analysis/e1e0c675-179b-453e-9d4f-226eb0ddcd6b/068b2e8b-025a-4eb5-8fe0-4197e48e733d/068b2e8b-025a-4eb5-8fe0-4197e48e733d?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Credential=AKIAQTEOOHOGGDJ5YJFY%2F20251025%2Feu-west-3%2Fs3%2Faws4_request&X-Amz-Date=20251025T151958Z&X-Amz-Expires=3600&X-Amz-Signature=4f408ef37c4a513e943c63f398327c475b5e03461d4a6831eddf0a5ac7244ae4&X-Amz-SignedHeaders=host&x-amz-checksum-mode=ENABLED&x-id=GetObject
      ]

    AnalysisEntryGetTranscriptPresignedUrl:
      type: string
      format: url
