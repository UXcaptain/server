openapi: '3.1.0'
info:
  version: '1.0.0'
  title: 'UXcaptain API'
  description: Buy or rent user tests

servers:
  [
    {
      "url": "server.latest.uxcaptain.com/api",
      "description": "latest branch server for uxcaptain"
    },
    {
      url: "server.next.uxcaptain.com/api",
      "description": "next branch server uxcaptain"
    }
  ]

paths:
  /v1/admin:
    get:
      summary: Get all users
      description: Returns all users - Allows for filtering via query parameters
      tags: ["admin"]
      parameters:
          - name: role
            in: query
            description: Indicates the role of the user
            required: false
            schema: 
                $ref: "#/components/schemas/UserRoles"
          - name: email
            in: query
            description: email of the user
            required: false
            schema:
                $ref: "#/components/schemas/UserEmail"
          - name: id
            in: query
            description: id of the user
            required: false
            schema:
                $ref: "#/components/schemas/UserId"

      responses:
        200:
          description: Success
          content:
            application/json:
                schema:
                    type: object
                    properties:
                        success:
                            $ref: "#/components/schemas/SuccessTrueStatus"
                        message:
                          description: message related to the requestBody - Appends "- cache" or "- DB" depending where the data is obtained from
                          type: string
                          examples: [
                            "Users successfully retrieved - DB",
                            "User successfully retrieved - cache"
                          ]
                        cacheKey:
                          $ref: "#/components/schemas/CacheKey"
                        cacheTTL_seconds: 
                          $ref: "#/components/schemas/CacheTTL_seconds"
                        userCount:
                            description: Indicates the number of users being returned
                            type: integer
                            examples: [
                              1
                            ]
                        users:
                            type: array
                            items:
                                $ref: '#/components/schemas/CustomerProfile'
                            
        403:
          description: User does not have the required permissions
          content:
            application/json:
                schema:
                    type: object
                    properties:
                        success:
                            $ref: "#/components/schemas/SuccessFalseStatus"
                        message:
                            type: string
                            examples: [
                              "User does not have the required permissions"
                            ]
        500:
          description: Unexpected error
          content:
            application/json:
              schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                $ref: '#/components/schemas/InternalErrorMessage'

  /v1/admin/{UserId}:
    get:
      summary: Returns one user
      description: Returns one user by UserId
      tags: ["admin"]
      parameters:
        - name: UserId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UserId"
      

      responses:
        200:
          description: Success
          content:
            application/json:
                schema:
                    type: object
                    properties:
                        success:
                            $ref: "#/components/schemas/SuccessTrueStatus"
                        message:
                          description: message related to the requestBody - Appends "- cache" or "- DB" depending where the data is obtained from
                          type: string
                          examples: [
                            "Users successfully retrieved - DB"
                          ]
                        user:
                            $ref: "#/components/schemas/CustomerProfile"
        400:
          description: User not found
          content:
            application/json:
                schema:
                    type: object
                    properties:
                        success:
                            $ref: "#/components/schemas/SuccessFalseStatus"
                        message:
                            type: string
                            examples: [
                              "User not found"
                            ]
        403:
          description: User does not have the required permissions
          content:
            application/json:
                schema:
                    type: object
                    properties:
                        success:
                            $ref: "#/components/schemas/SuccessFalseStatus"
                        message:
                            type: string
                            examples: [
                              "User does not have the required permissions"
                            ]
        500:
          description: Unexpected error
          content:
            application/json:
              schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                $ref: '#/components/schemas/InternalErrorMessage'
    
    delete:
      summary: Deletes one user
      description: This endpoint will delete one user
      tags: ["admin"]
      parameters:
        - name: UserId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UserId"
      

      responses:
        200:
          description: Success
          content:
            application/json:
                schema:
                    type: object
                    properties:
                        success:
                            $ref: "#/components/schemas/SuccessTrueStatus"
                        message:
                            type: string
                            examples: [
                              "User successfully deleted"
                            ] 
        403:
          description: User deletion failed - User does not have the required permissions
          content:
            application/json:
                schema:
                    type: object
                    properties:
                        success:
                            $ref: "#/components/schemas/SuccessFalseStatus"
                        message:
                            type: string
                            examples: [
                              "User deletion failed - User does not have the required permissions"
                            ]
        404:
          description: User deletion failed - User does not exist
          content:
            application/json:
                schema:
                    type: object
                    properties:
                        success:
                            $ref: "#/components/schemas/SuccessFalseStatus"
                        message:
                            type: string
                            examples: [
                              "User deletion failed - User does not exist"
                            ] 
        409:
          description: User deletion failed - Related DB entries exist
          content:
            application/json:
                schema:
                    type: object
                    properties:
                        success:
                            $ref: "#/components/schemas/SuccessFalseStatus"
                        message:
                            type: string
                            example: [
                              "User deletion failed - Related DB entries exist"
                            ]
        500:
          description: Unexpected error
          content:
            application/json:
              schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                $ref: '#/components/schemas/InternalErrorMessage'

  /v1/auth/session:
    get:
      summary: Checks if the session is active
      description: Checks if the session is active for a given UserId
      tags: ["auth"]

      responses:
        200:
          description: Success
          content:
            application/json:
                schema:
                    type: object
                    properties:
                        success:
                            $ref: "#/components/schemas/SuccessTrueStatus"
                        message:
                          description: message related to the requestBody - Appends "- cache" or "- DB" depending where the data is obtained from
                          type: string
                          examples: [
                            "Session is valid"
                          ]
                        user:
                            type: object
                            properties:
                              id:
                                $ref: '#/components/schemas/UserId'
        401:
          description: Session is not valid
          content:
            application/json:
              schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                type: string
                                examples: [
                                  "Session is not valid"
                                ]
  /v1/waitlist:
    post:
        summary: Adds a new user to the launch waitlist
        description: Adds a new user to the launch waitlist
        tags: ["waitlist"]
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required:
                          - email
                          - consent
                        properties:
                            email:
                                $ref: "#/components/schemas/UserEmail"
                            consent:
                                $ref: "#/components/schemas/Consent"
        responses:
            200:
                description: Success
                content:
                  application/json:
                      schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessTrueStatus"
                              message:
                                type: string
                                example: User was sucessfully added to launch waitlist
            422:
              description: Validation error
              content:
                application/json:
                    schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                type: string
                                example: User could not be created due to validation errors
                              errors:
                                type: array
                                items:
                                  $ref: "#/components/schemas/ValidationErrors"
            500:
              description: Unexpected error
              content:
                application/json:
                    schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                $ref: '#/components/schemas/InternalErrorMessage'


  /v1/auth/register/local:
    post:
        summary: Register a new user
        description: Registers one user
        tags: ["auth"]
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required:
                          - email
                          - password
                          - role
                        properties:
                            email:
                                $ref: "#/components/schemas/UserEmail"
                            password:
                                $ref: "#/components/schemas/UserPassword"
                            role:
                                $ref: "#/components/schemas/UserRoles"
                            utm_source:
                                $ref: "#/components/schemas/UtmSource"
                            utm_medium:
                                $ref: "#/components/schemas/UtmMedium"
                            utm_campaign:
                                $ref: "#/components/schemas/UtmCampaign"
                            utm_content:
                                $ref: "#/components/schemas/UtmContent"
                            utm_term:
                                $ref: "#/components/schemas/UtmTerm"
                            gclid:
                                $ref: "#/components/schemas/Gclid"
                            fbclid:
                                $ref: "#/components/schemas/Fbclid"
        responses:
            201:
                description: Success
                content:
                  application/json:
                      schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessTrueStatus"
                              message:
                                type: string
                                example: User created successfully
                              userId:
                                $ref: "#/components/schemas/UserId"
            409:
              description: User already exists
              content:
                application/json:
                    schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                type: string
                                example: User creation failed - User already exists
            422:
              description: Validation error
              content:
                application/json:
                    schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                type: string
                                example: User could not be created due to validation errors
                              errors:
                                type: array
                                items:
                                  $ref: "#/components/schemas/ValidationErrors"
            500:
              description: Unexpected error
              content:
                application/json:
                    schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                $ref: '#/components/schemas/InternalErrorMessage'
                
  /v1/auth/login/local:
    post:
        summary: Local strategy login route
        description: Login a user using local strategy.
        tags: ["auth"]
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required:
                          - email
                          - password
                        properties:
                            email:
                                $ref: "#/components/schemas/UserEmail"
                            password:
                                $ref: "#/components/schemas/UserPassword"
        responses:
            200:
                description: Success
                content:
                  application/json:
                      schema:
                          type: object
                          properties:
                              message:
                                type: string
                                example: Login successful
                              user:
                                type: object
                                properties:
                                    id: 
                                        $ref: "#/components/schemas/UserId"
                                    role: 
                                        $ref: "#/components/schemas/UserRoles"
            401:
              description: Incorrect email & password combination
              content:
                application/json:
                    schema:
                          type: object
                          properties:
                              message:
                                type: string
                                example: The combination of email and password is incorrect
             
            403:
              description: Participant login is disabled
              content:
                application/json:
                    schema:
                          type: object
                          properties:
                              message:
                                type: string
                                example: Participant login is disabled
            422:
              description: Validation error
              content:
                application/json:
                    schema:
                          type: object
                          properties:
                              message:
                                type: string
                                example: User could not be created due to validation errors
                              errors:
                                type: array
                                items:
                                  $ref: "#/components/schemas/ValidationErrors"
             
            500:
              description: Unexpected error
              content:
                application/json:
                    schema:
                          type: object
                          properties:
                              message:
                                    $ref: '#/components/schemas/InternalErrorMessage'

  /v1/auth/logout:
    post:
        summary: Local strategy logout  route
        description: Logs out a currently authenticated user using local strategy.
        tags: ["auth"]

        responses:
            200:
                description: Success
                content:
                  application/json:
                      schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessTrueStatus"
                              message:
                                type: string
                                examples: [
                                  "User logged out successfully"
                                ]
            400:
              description: User is not logged in
              content:
                application/json:
                    schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                  type: string
                                  examples: [
                                    "User is not logged in"
                                  ]
            500:
              description: Unexpected error
              content:
                application/json:
                    schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                    $ref: '#/components/schemas/InternalErrorMessage'

  /v1/auth/update-user-password:
    patch:
      summary: Update the password of a user
      description: Update the password of a user. 
      tags: ["auth"]
      requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required:
                          - currentPassword
                          - newPassword
                        properties:
                            currentPassword:
                                $ref: "#/components/schemas/UserPassword"
                            newPassword:
                                $ref: "#/components/schemas/UserPassword"
      responses:
        200:
                description: Success
                content:
                  application/json:
                      schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessTrueStatus"
                              message:
                                type: string
                                example: Password updated successfully  
        400:
              description: Password update failed - old password is incorrect
              content:
                application/json:
                    schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                type: string
                                example: Current password is incorrect
             
        
        404:
              description: User not found
              content:
                application/json:
                    schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                type: string
                                example: User not found
             
        
        422:
                description: Validation error
                content:
                  application/json:
                      schema:
                            type: object
                            properties:
                                success:
                                    $ref: "#/components/schemas/SuccessFalseStatus"
                                message:
                                  type: string
                                  example: User could not be created due to validation errors
                                errors:
                                  type: array
                                  items:
                                    $ref: "#/components/schemas/ValidationErrors"
        500:
              description: Unexpected error
              content:
                application/json:
                    schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                    $ref: '#/components/schemas/InternalErrorMessage'

  /v1/auth/password-reset:
    get:
      summary: Validate the password reset token
      description: Validate the password reset token.
      tags: ["auth"]
      parameters:
          - name: token
            in: query
            description: Indicates the status of token
            required: true
            schema: 
                $ref: "#/components/schemas/PasswordResetToken"

      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    $ref: "#/components/schemas/SuccessTrueStatus"
                  message:
                    type: string
                    example: Successfully retrieved password reset token
        400:
          description: Password reset token has not been provided
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    $ref: "#/components/schemas/SuccessFalseStatus"
                  message:
                    type: string
                    example: Token is required
        403:
          description: Password reset token is expired
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    $ref: "#/components/schemas/SuccessFalseStatus"
                  message:
                    type: string
                    example: Token expired - Please request a new password reset link
        404:
          description: Password reset token was not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    $ref: "#/components/schemas/SuccessFalseStatus"
                  message:
                    type: string
                    example: Password reset token does not exist
         
        500:
          description: Unexpected error
          content:
            application/json:
                schema:
                      type: object
                      properties:
                          success:
                              $ref: "#/components/schemas/SuccessFalseStatus"
                          message:
                                $ref: '#/components/schemas/InternalErrorMessage'

    post:
      summary: Request a new password reset token
      description: Request a new password reset token for the user.
      tags: ["auth"]
      requestBody:
        required: true
        content: 
          application/json:
            schema:
                type: object
                required:
                  - email
                properties:
                      email:
                        $ref: '#/components/schemas/UserEmail'
      

      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    $ref: "#/components/schemas/SuccessTrueStatus"
                  message:
                    type: string
                    example: If this email exists, a reset link will be sent
        500:
          description: Unexpected error
          content:
            application/json:
                schema:
                      type: object
                      properties:
                          success:
                              $ref: "#/components/schemas/SuccessFalseStatus"
                          message:
                                $ref: '#/components/schemas/InternalErrorMessage'

    patch:
      summary: Update user password using password reset token
      tags: ["auth"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                  newPassword:
                      $ref: "#/components/schemas/UserPassword"
                  confirmNewPassword:
                      $ref: "#/components/schemas/UserPassword"
                  passwordResetToken:
                      $ref: "#/components/schemas/PasswordResetToken"


      responses:
        200:
            description: Success
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    success:
                      $ref: "#/components/schemas/SuccessTrueStatus"
                    message:
                      type: string
                      example: User password updated successfully using password reset token
        400:
            description: Token expired or passwords do not match
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    success:
                      $ref: "#/components/schemas/SuccessFalseStatus"
                    message:
                      type: string
                      examples: [
                        "Token expired - Please request a new password reset link",
                        "Passwords do not match"
                      ]
        422:
              description: Validation error
              content:
                application/json:
                    schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                type: string
                                examples: [
                                  "Analysis could not be created due to validation errors"
                                ]
                              errors:
                                type: array
                                items:
                                  $ref: "#/components/schemas/ValidationErrors"
        500:
          description: Unexpected error
          content:
            application/json:
                schema:
                      type: object
                      properties:
                          success:
                              $ref: "#/components/schemas/SuccessFalseStatus"
                          message:
                                $ref: '#/components/schemas/InternalErrorMessage'

  /v1/user:
    get:
     summary: Returns the user profile
     description: Returns the user profile of the currently authenticated user. 
     tags: ["user"]

     responses:
       200:
         description: Success
         content:
           application/json:
             schema:
              type: object
              properties:
                success:
                  $ref: "#/components/schemas/SuccessTrueStatus"
                message:
                  type: string
                  example: user profile retrieved successfully - cache
                cacheKey:
                  $ref: "#/components/schemas/CacheKey"
                cacheTTL_seconds: 
                  $ref: "#/components/schemas/CacheTTL_seconds"
                user:
                  $ref: "#/components/schemas/CustomerProfile"
                
       401:
         description: User not authenticated
         content:
           application/json:
             schema:
               type: object
               properties:
                 success:
                   $ref: "#/components/schemas/SuccessFalseStatus"
                 message:
                   type: string
                   example: Unauthorized access
       500:
          description: Unexpected error
          content:
            application/json:
                schema:
                      type: object
                      properties:
                          success:
                              $ref: "#/components/schemas/SuccessFalseStatus"
                          message:
                                $ref: '#/components/schemas/InternalErrorMessage'
    delete:
      summary: Deletes the user account
      description: Deletes the user account and all related data from the database. This operation is irreversible and should be used with caution.
      tags: ["user"]
      responses:
        200:
         description: Success
         content:
           application/json:
             schema:
              type: object
              properties:
                success:
                  $ref: "#/components/schemas/SuccessTrueStatus"
                message:
                  type: string
                  example: User deleted successfully
        409:
          description: User deletion failed - Related DB entries exist
          content:
            application/json:
                schema:
                    type: object
                    properties:
                        success:
                            $ref: "#/components/schemas/SuccessFalseStatus"
                        message:
                            type: string
                            example: User deletion failed - Related DB entries exist
        500:
            description: Unexpected error
            content:
              application/json:
                  schema:
                        type: object
                        properties:
                            success:
                                $ref: "#/components/schemas/SuccessFalseStatus"
                            message:
                                  $ref: '#/components/schemas/InternalErrorMessage'
      
  /v1/analysis:
    get:
      summary: Retrieve all analyses
      description: Retrieve all analyses for a given user.
      tags: ["Analysis"]
      parameters:
          - name: status
            in: query
            description: Indicates the status of the analysis
            required: false
            schema: 
                $ref: "#/components/schemas/AnalysisStatus"
          - name: device
            in: query
            description: Indicates the device in which the analysis has been run
            required: false
            schema:
                $ref: "#/components/schemas/AnalysisDevice"

      responses:
        200:
          description: Success
          content:
            application/json:
                schema:
                    type: object
                    properties:
                        success:
                            $ref: "#/components/schemas/SuccessTrueStatus"
                        message:
                          description: message related to the requestBody - Appends "- cache" or "- DB" depending where the data is obtained from
                          type: string
                          examples: [
                            "Analysis successfully retrieved - DB",
                            "Analysis successfully retrieved - cache"
                          ]
                        cacheKey:
                          $ref: "#/components/schemas/CacheKey"
                        cacheTTL_seconds: 
                          $ref: "#/components/schemas/CacheTTL_seconds"
                        analysisCount:
                            description: Indicates the number of Analysis being returned
                            type: integer
                            examples: [
                              1
                            ]
                        analyses:
                            type: array
                            items:
                                $ref: '#/components/schemas/AnalysisWithCount'

                            
        500:
          description: Unexpected error
          content:
            application/json:
              schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                $ref: '#/components/schemas/InternalErrorMessage'

    post:
      summary: Create a new analysis
      description: Creates a new analysis - given that the validation is passed.
      tags: ["Analysis"]
      requestBody:
        required: true
        content: 
          application/json:
            schema:
                type: object
                required:
                  - name
                  - url
                  - maxNumberOfParticipants
                  - device
                  - tasks
                properties:
                      name:
                        $ref: '#/components/schemas/AnalysisName'
                      url:
                        $ref: '#/components/schemas/AnalysisUrl'
                      scenario:
                        $ref: '#/components/schemas/AnalysisScenario'
                      maxNumberOfParticipants:
                        $ref: '#/components/schemas/AnalysisMaxNumberOfParticipants'
                      tasks:
                        $ref: '#/components/schemas/AnalysisTasksArray'
                      device:
                        $ref: '#/components/schemas/AnalysisDevice'

      responses:
        201:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    $ref: "#/components/schemas/SuccessTrueStatus"
                  message:
                    type: string
                    examples: [
                      "analysis created successfully"
                    ]
                  createdAnalysisId:
                    $ref: "#/components/schemas/AnalysisId"
        422:
              description: Validation error
              content:
                application/json:
                    schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                type: string
                                examples: [
