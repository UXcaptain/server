  minio:
    image: minio/minio:latest
    container_name: minio
    restart: on-failure
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - /Users/martaperezsanchez/repos/minio:/data
    ports:
      - 9000:9000
      - 9001:9001
    command: server /data --console-address ":9001"
    networks:
      - uxcaptain-network
  
  database:
    image: postgres:17.5
    restart: on-failure
    container_name: postgresDB
    user: 
      postgres
    volumes:
      - uxcaptain-database:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - 5432:5432
    networks:
      - uxcaptain-network 

  whisper-transcribe:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: whisper-asr
    ports:
      - 9006:9000
    volumes:
      - whisper-transcription-models:/root/.cache  # Model persistence (~2-5GB)
      - /Users/martaperezsanchez/repos/minio:ro  # Mount your video storage
    environment:
      - ASR_MODEL=medium  # Or base/tiny for speed
      - ASR_DEVICE=cpu
      - ASR_ENGINE=openai_whisper
      - MAX_REQUEST_SIZE=5000  # MB for large videos
      - MODEL_IDLE_TIMEOUT=900  # Keep model loaded 15min
    restart: unless-stopped
    depends_on:
      - minio
    networks:
      - uxcaptain-network  # Same as MinIO/monolith



