# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose

name: uxcaptain
services:
  server:
    container_name: server
    build:
      context: .
    environment:
      NODE_ENV: ${NODE_ENV}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BETTERSTACK_SOURCE_TOKEN: ${BETTERSTACK_SOURCE_TOKEN}
      BETTERSTACK_INGESTING_HOST: ${BETTERSTACK_INGESTING_HOST}
      PRISMA_POSTGRES_DIRECT_URL: postgresql://postgres:prismaORM124!@database:5432/public
      PRISMA_POSTGRES_CONNECTION_STRING: postgresql://postgres:prismaORM124!@database:5432/public
      TELEGRAM_BOT_API_KEY: ${TELEGRAM_BOT_API_KEY}
      FRONT_WEB_APP_ORIGIN_URL: ${FRONT_WEB_APP_ORIGIN_URL}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      PORT: ${PORT}
      VALKEY_CACHE_HOST: ${VALKEY_CACHE_HOST}
      VALKEY_CACHE_PORT: ${VALKEY_CACHE_PORT}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - 3000:3000
    develop:
      watch:
        - path: .
          action: sync+restart #* Synchronize code changes and restart the server
          target: /usr/src/app/
    depends_on: #* References the SERVICE name - NOT the container_name
      database:
        condition: service_started
    networks:
      - uxcaptain-network
  
  database:
    image: postgres:17.5
    restart: on-failure
    container_name: postgresDB
    user: 
      postgres
    volumes:
      - uxcaptain-database:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=public
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=prismaORM124!
    ports:
      - 5432:5432
    networks:
      - uxcaptain-network 

networks:
  uxcaptain-network:
    name: uxcaptain-network
    driver: bridge

volumes:
  uxcaptain-database:

