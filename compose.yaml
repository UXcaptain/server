# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  uxmonkeys-server:
    container_name: back_end-service
    build:
      context: .
    environment:
      NODE_ENV: ${NODE_ENV}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      BREVO_API_KEY: ${BREVO_API_KEY}
      PINOJS_SOURCE_TOKEN: ${PINOJS_SOURCE_TOKEN}
      PRISMA_POSTGRES_CONNECTION_STRING: postgresql://postgres:prismaORM124!@backend-db:5432/public
      PRISMA_POSTGRES_CONNECTION_DIRECT_URL: postgresql://postgres:prismaORM124!@backend-db:5432/public
      MONGODB_USERNAME: ${MONGODB_USERNAME}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_CONNECTION_STRING: ${MONGODB_CONNECTION_STRING}
      TELEGRAM_BOT_API_KEY: ${TELEGRAM_BOT_API_KEY}
      FRONT_WEB_APP_ORIGIN_URL: ${FRONT_WEB_APP_ORIGIN_URL}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      PORT: ${PORT}
      VALKEY_CACHE_HOST: ${VALKEY_CACHE_HOST}
      VALKEY_CACHE_PORT: ${VALKEY_CACHE_PORT}
    ports:
      - 3000:3000
    develop:
      watch:
        - path: .
          action: sync+restart #* Synchronize code changes and restart the server
          target: /usr/src/app/
    depends_on: #* References the SERVICE name - NOT the container_name
      backend-db:
        condition: service_started
      # uxmonkeys-cache: 
      #   condition: service_started
    networks:
      - uxmonkeys-network

  backend-db:
    image: postgres:16.8
    restart: on-failure
    container_name: back_end_db-service
    user: 
      postgres
    volumes:
      - backend-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=public
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=prismaORM124!
    ports:
      - 5432:5432
    networks:
      - uxmonkeys-network 

  # uxmonkeys-cache: #* Disabled the cache services
  #   image: valkey/valkey:latest
  #   container_name: valkey_cache-service
  #   restart: on-failure
  #   ports:
  #     - 6379:6379
  #   networks:
  #     - uxmonkeys-network

networks:
  uxmonkeys-network:
    driver: bridge
    
    

volumes:
  backend-db-data:

