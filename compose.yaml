  #       action: sync+restart
  #       target: /usr/src/app/
  #   networks:
  #     - uxcaptain-network
  
  database:
    image: postgres:17.5
    restart: on-failure
    container_name: postgresDB
    user: 
      postgres
    volumes:
      - uxcaptain-database:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=public
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=prismaORM124!
    ports:
      - 5432:5432
    networks:
      - uxcaptain-network 

  # uxcaptain-cache: #* Disabled the cache services
