openapi: '3.1.0'
info:
  version: '1.0.0'
  title: 'UXmonkeys API'
  description: Buy or rent user tests

servers:
  [
    {
      "url": "prod.uxmonkeys.com/api",
      description: "Prod server for uxmonkeys"
    },
    {
      url: "dev.uxmonkeys.com/api",
      description: "dev server uxmonkeys"
    }
  ]

paths:
  /v1/admin:
    get:
      summary: Get all users
      description: Returns all users - Allows for filtering via query parameters
      tags: ["admin"]
      parameters:
          - name: role
            in: query
            description: Indicates the role of the user
            required: false
            schema: 
                $ref: "#/components/schemas/UserRoles"
          - name: email
            in: query
            description: email of the user
            required: false
            schema:
                type: string
                format: email
                examples: [
                  username@gmail.com
                ]
          - name: id
            in: query
            description: id of the user
            required: false
            schema:
                $ref: "#/components/schemas/userId"

      responses:
        200:
          description: Success
          content:
            application/json:
                schema:
                    type: object
                    properties:
                        success:
                            $ref: "#/components/schemas/SuccessTrueStatus"
                        message:
                          description: message related to the requestBody - Appends "- cache" or "- DB" depending where the data is obtained from
                          type: string
                          examples: [
                            Users successfully retrieved - DB
                          ]
                        userCount:
                            description: Indicates the number of users being returned
                            type: integer
                            examples: [
                              1
                            ]
                        users:
                            type: array
                            items:
                                $ref: '#/components/schemas/User'
                            
        500:
          description: Unexpected error
          content:
            application/json:
              schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                $ref: '#/components/schemas/InternalErrorMessage'

  /v1/admin/{userId}:
    get:
      summary: Returns one user
      description: Returns one user by userId
      tags: ["admin"]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/userId"
      

      responses:
        200:
          description: Success
          content:
            application/json:
                schema:
                    type: object
                    properties:
                        success:
                            $ref: "#/components/schemas/SuccessTrueStatus"
                        message:
                          description: message related to the requestBody - Appends "- cache" or "- DB" depending where the data is obtained from
                          type: string
                          examples: [
                            Users successfully retrieved - DB
                          ]
                        user:
                            $ref: "#/components/schemas/User"
        500:
          description: Unexpected error
          content:
            application/json:
              schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                $ref: '#/components/schemas/InternalErrorMessage'
  
    delete:
      summary: Deletes one user
      description: This endpoint will delete one user
      tags: ["admin"]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/userId"
      

      responses:
        200:
          description: Success
          content:
            application/json:
                schema:
                    type: object
                    properties:
                        success:
                            $ref: "#/components/schemas/SuccessTrueStatus"
                        message:
                            type: string
                            examples: [
                              User successfully deleted
                            ] 
        403:
          description: User deletion failed - User does not have the required permissions
          content:
            application/json:
                schema:
                    type: object
                    properties:
                        success:
                            $ref: "#/components/schemas/SuccessFalseStatus"
                        message:
                            type: string
                            examples: [
                              User deletion failed - User does not have the required permissions
                            ]
        404:
          description: User deletion failed - User does not exist
          content:
            application/json:
                schema:
                    type: object
                    properties:
                        success:
                            $ref: "#/components/schemas/SuccessFalseStatus"
                        message:
                            type: string
                            examples: [
                              User deletion failed - User does not exist
                            ] 
        409:
          description: User deletion failed - Related DB entries exist
          content:
            application/json:
                schema:
                    type: object
                    properties:
                        success:
                            $ref: "#/components/schemas/SuccessFalseStatus"
                        message:
                            type: string
                            example: [
                              User deletion failed - Related DB entries exist
                            ]
        500:
          description: Unexpected error
          content:
            application/json:
              schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                $ref: '#/components/schemas/InternalErrorMessage'
    
  /v1/auth/register/local:
    post:

        summary: Register a new user
        description: Registers one user
        tags: ["auth"]
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required:
                          - email
                          - password
                        properties:
                            email:
                                type: string
                                format: email
                                description: 8 chars minimum
                                example: username@gmail.com
                            password:
                                type: string
                                format: password
                                description: user password
                                example: 123456
        responses:
            200:
                description: Success
                content:
                  application/json:
                      schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessTrueStatus"
                              message:
                                type: string
                                example: User created successfully
                              userId:
                                $ref: "#/components/schemas/userId"
            409:
              description: User already exists
              content:
                application/json:
                    schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                type: string
                                example: User creation failed - The email address already exists
            422:
              description: Validation error
              content:
                application/json:
                    schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                type: string
                                example: User could not be created due to validation errors
                              errors:
                                type: array
                                items:
                                  $ref: "#/components/schemas/ValidationErrors"
            500:
              description: Unexpected error
              content:
                application/json:
                    schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                $ref: '#/components/schemas/InternalErrorMessage' 
                
  /v1/auth/login/local:
    post:
        summary: Local strategy login route
        description: Login a user using local strategy.
        tags: ["auth"]
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required:
                          - email
                          - password
                        properties:
                            email:
                                type: string
                                format: email
                                example: username@gmail.com
                            password:
                                type: string
                                format: password
                                description: user password
                                example: 123456
        responses:
            200:
                description: Success
                content:
                  application/json:
                      schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessTrueStatus"
                              message:
                                type: string
                                example: Login successful
                              user:
                                type: array
                                items:
                                  type: object
                                  properties:
                                      id: 
                                          $ref: "#/components/schemas/userId"
                                      role: 
                                          $ref: "#/components/schemas/UserRoles"
            401:
              description: Incorrect email & password combination
              content:
                application/json:
                    schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                type: string
                                example: The combination of email and password is incorrect
            
            422:
              description: Validation error
              content:
                application/json:
                    schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                type: string
                                example: User could not be created due to validation errors
                              errors:
                                type: array
                                items:
                                  $ref: "#/components/schemas/ValidationErrors"
            
            500:
              description: Unexpected error
              content:
                application/json:
                    schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                    $ref: '#/components/schemas/InternalErrorMessage'

  /v1/auth/update-user-password:
    patch:
      summary: Update the password of a user
      description: Update the password of a user. 
      tags: ["auth"]
      requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required:
                          - currentPassword
                          - newPassword
                        properties:
                            currentPassword:
                                type: string
                                format: password
                                example: 123456

                            newPassword:
                                type: string
                                format: password
                                description: user password
                                example: 123456
      responses:
        200:
                description: Success
                content:
                  application/json:
                      schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessTrueStatus"
                              message:
                                type: string
                                example: Password updated successfully
             
        400:
              description: Password update failed - old password is incorrect
              content:
                application/json:
                    schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                type: string
                                example: Password update failed - old password is incorrect
            
            
        401:
              description: User already exists
              content:
                application/json:
                    schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                type: string
                                example: User not found
            
            
        422:
                description: Validation error
                content:
                  application/json:
                      schema:
                            type: object
                            properties:
                                success:
                                    $ref: "#/components/schemas/SuccessFalseStatus"
                                message:
                                  type: string
                                  example: User could not be created due to validation errors
                                errors:
                                  type: array
                                  items:
                                    $ref: "#/components/schemas/ValidationErrors"
        500:
              description: Unexpected error
              content:
                application/json:
                    schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                    $ref: '#/components/schemas/InternalErrorMessage'

  /v1/auth/validate-password-reset-token:
    get:
      summary: Validate the password reset token
      description: Validate the password reset token.
      tags: ["auth"]


  /v1/auth/request-new-password:
    post:
      summary: Request a new password reset token
      description: Request a new password reset token for the user.
      tags: ["auth"]


  /v1/auth/create-new-user-password:
    patch:
      summary: Create a new password for the user using the password reset token
      tags: ["auth"]

  /v1/user:
    get:
     summary: Returns the user profile
     description: Returns the user profile of the currently authenticated user. 
     tags: ["user"]

     responses:
       200:
         description: Success
         content:
           application/json:
             schema:
              type: object
              properties:
                success:
                  $ref: "#/components/schemas/SuccessTrueStatus"
                message:
                  type: string
                  example: User retrieved successfully
                user:
                  $ref: "#/components/schemas/User"
                
       401:
         description: User not authenticated
         content:
           application/json:
             schema:
               type: object
               properties:
                 success:
                   $ref: "#/components/schemas/SuccessFalseStatus"
                 message:
                   type: string
                   example: Unauthorized access
       409:
          description: User deletion failed - Related DB entries exist
          content:
            application/json:
                schema:
                    type: object
                    properties:
                        success:
                            $ref: "#/components/schemas/SuccessFalseStatus"
                        message:
                            type: string
                            example: User deletion failed - Related DB entries exist
       500:
              description: Unexpected error
              content:
                application/json:
                    schema:
                          type: object
                          properties:
                              success:
                                  $ref: "#/components/schemas/SuccessFalseStatus"
                              message:
                                    $ref: '#/components/schemas/InternalErrorMessage'
    delete:
      summary: Deletes the user account
      description: Deletes the user account and all related data from the database. This operation is irreversible and should be used with caution.
      tags: ["user"]
      responses:
        200:
         description: Success
         content:
           application/json:
             schema:
              type: object
              properties:
                success:
                  $ref: "#/components/schemas/SuccessTrueStatus"
                message:
                  type: string
                  example: User retrieved successfully
                user:
                  $ref: "#/components/schemas/User"
        409:
          description: User deletion failed - Related DB entries exist
          content:
            application/json:
                schema:
                    type: object
                    properties:
                        success:
                            $ref: "#/components/schemas/SuccessFalseStatus"
                        message:
                            type: string
                            example: User deletion failed - Related DB entries exist
        500:
            description: Unexpected error
            content:
              application/json:
                  schema:
                        type: object
                        properties:
                            success:
                                $ref: "#/components/schemas/SuccessFalseStatus"
                            message:
                                  $ref: '#/components/schemas/InternalErrorMessage'
    
       





components:
  schemas:
    
    SuccessTrueStatus:
      description: Success status for any API call
      type: boolean
      example: true

    SuccessFalseStatus:
      description: false status for any API call
      type: boolean
      example: false

    userId:
      description: The unique identifier of a user
      type: string
      format: uuid
      example: c20432a3-7667-4b82-a653-f0af5cf47464
    
    
    analysisId:
        description: The unique identifier of an analysis
        type: string
        format: uuid
        example: 53c3c74e-1d1a-4a4e-9ee1-4974d7402bfd
    
    
    entryId:
        description: The unique identifier of an entry
        type: string
        format: uuid
        example: d7c8843e-b500-45be-a3e6-7f2d3c33ae13
    
    UserRoles:
      type: string
      default: customer
      enum: [customer, admin, participant]
      description: role assigned to user
      example: customer
    

    ValidationErrors:
      type: object
      properties:
        type:
          type: string
          example: field
        value:
          type: string
          example: [ REDACTED ]
        msg:
          type: string
          example: Username is required
        path:
          type: string
          example: username
        location:
          type: string
          example: body

    User:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/userId'
        email:
          type: string
          format: email
          example: username@gmail.com
        role:
          $ref: "#/components/schemas/UserRoles"
        created_at:
          type: string
          example: 2025-05-15T14:23:21.303Z
        last_updated_at:
            type: string
            example: 2025-05-15T14:23:21.303Z
        last_login_at:
            type: string
            example: 2025-05-15T14:23:21.303Z
        stripe_customer_id:
            type: string
            example: 123456
    
    AnalysisDevice:
      type: string
      enum: [computer, mobile, tablet, other]
      description: The device that the participants should complete the analysis on
      example: computer
    
    AnalysisStatus:
      type: string
      default: published
      enum: [draft, published, completed]
      description: The status of the analysis

    AnalysisEntryCompletionStatus:
      type: string
      default: in_progress
      enum: [in_progress, cancelled, submitted, accepted, rejected]
      description: The status of the analysis entry
    
    
    InternalErrorMessage:
      type: string
      description: Indicates an internal error failure (status 500)
      example: Internal server error - Please contact us
  
  
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
security:
  - ApiKey: []