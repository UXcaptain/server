name: Push to Docker Hub, build and deploy :next tag image to Koyeb

on:
    pull_request:
        branches: [ "latest" ]

jobs:
    docker-build-and-push:
        runs-on: ubuntu-latest
        steps:
        -
            name: Checkout
            uses: actions/checkout@v4
        -
            name: Login to Docker Hub
            uses: docker/login-action@v3
            with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
        -
            name: Set up QEMU
            uses: docker/setup-qemu-action@v3
        -
            name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3
        -
            name: Build and push
            uses: docker/build-push-action@v6
            with:
                context: .
                platforms: linux/amd64,linux/arm64
                push: true
                tags: sergion14/uxmonkeys:server-next
    
    
    koyeb-deploy:
        runs-on: ubuntu-latest
        environment: prod
        needs: docker-build-and-push
        concurrency: 
            group: "${{ github.ref_name }}"
            cancel-in-progress: true
        steps:
            - 
                name: Install and configure the Koyeb CLI
                uses: koyeb-community/koyeb-actions@v2
                with:
                    api_token: "${{ secrets.KOYEB_API_TOKEN }}"
            - 
                name: Create POSTHOG_API_KEY secret
                uses: koyeb/action-git-deploy/secret@v1
                with:
                    secret-name: PROD_POSTHOG_API_KEY
                    secret-value: "${{ secrets.POSTHOG_API_KEY }}"
            - 
                name: Create SESSION_SECRET secret
                uses: koyeb/action-git-deploy/secret@v1
                with:
                    secret-name: PROD_SESSION_SECRET
                    secret-value: "${{ secrets.SESSION_SECRET }}"
            - 
                name: Create Brevo API key secret
                uses: koyeb/action-git-deploy/secret@v1
                with:
                    secret-name: PROD_BREVO_API_KEY
                    secret-value: "${{ secrets.BREVO_API_KEY }}"
            - 
                name: Create PINOJS_SOURCE_TOKEN secret
                uses: koyeb/action-git-deploy/secret@v1
                with:
                    secret-name: PROD_PINOJS_SOURCE_TOKEN
                    secret-value: "${{ secrets.PINOJS_SOURCE_TOKEN }}"
            - 
                name: Create PRISMA_POSTGRES_DIRECT_URL secret
                uses: koyeb/action-git-deploy/secret@v1
                with:
                    secret-name: PROD_PRISMA_POSTGRES_DIRECT_URL
                    secret-value: "${{ secrets.PRISMA_POSTGRES_DIRECT_URL }}"
            - 
                name: Create PRISMA_POSTGRES_CONNECTION_STRING secret
                uses: koyeb/action-git-deploy/secret@v1
                with:
                    secret-name: PROD_PRISMA_POSTGRES_CONNECTION_STRING
                    secret-value: "${{ secrets.PRISMA_POSTGRES_CONNECTION_STRING }}"
            - 
                name: Create PRISMA_POSTGRES_CONNECTION_STRING secret
                uses: koyeb/action-git-deploy/secret@v1
                with:
                    secret-name: AWS_SECRET_ACCESS_KEY
                    secret-value: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"

            # - 
            #     name: Create MONGODB_USERNAME secret
            #     uses: koyeb/action-git-deploy/secret@v1
            #     with:
            #         secret-name: PROD_MONGODB_USERNAME
            #         secret-value: "${{ secrets.MONGODB_USERNAME }}"
            # -
            #     name: Create MONGODB_PASSWORD secret
            #     uses: koyeb/action-git-deploy/secret@v1
            #     with:
            #         secret-name: PROD_MONGODB_PASSWORD
            #         secret-value: "${{ secrets.MONGODB_PASSWORD }}"
            # - 
            #     name: Create MONGODB_URI secret
            #     uses: koyeb/action-git-deploy/secret@v1
            #     with:
            #         secret-name: PROD_MONGODB_URI
            #         secret-value: "${{ secrets.MONGODB_URI }}"
            # - 
            #     name: Create MONGODB_CONNECTION_STRING secret
            #     uses: koyeb/action-git-deploy/secret@v1
            #     with:
            #         secret-name: PROD_MONGODB_CONNECTION_STRING
            #         secret-value: "${{ secrets.MONGODB_CONNECTION_STRING }}"
            # 
            - 
                name: Create TELEGRAM_BOT_API_KEY secret
                uses: koyeb/action-git-deploy/secret@v1
                with:
                    secret-name: TELEGRAM_BOT_API_KEY
                    secret-value: "${{ secrets.TELEGRAM_BOT_API_KEY }}"
            - 
                name: Create STRIPE_API_KEY secret
                uses: koyeb/action-git-deploy/secret@v1
                with:
                    secret-name: PROD_STRIPE_API_KEY
                    secret-value: "${{ secrets.STRIPE_API_KEY }}"
            - 
                name: Create STRIPE_WEBHOOK_SECRET secret
                uses: koyeb/action-git-deploy/secret@v1
                with:
                    secret-name: PROD_STRIPE_API_KEY
                    secret-value: "${{ secrets.STRIPE_WEBHOOK_SECRET }}"
            -
                name: Build and deploy the application to Koyeb
                uses: koyeb/action-git-deploy@v1
                with:
                    service-env: PORT=3000,NODE_ENV=production,BREVO_API_KEY=@PROD_BREVO_API_KEY,MONGODB_CONNECTION_STRING=@PROD_MONGODB_CONNECTION_STRING,POSTHOG_API_KEY=@PROD_POSTHOG_API_KEY,PINOJS_SOURCE_TOKEN=@PROD_PINOJS_SOURCE_TOKEN,PRISMA_POSTGRES_DIRECT_URL=@PROD_PRISMA_POSTGRES_DIRECT_URL,PRISMA_POSTGRES_CONNECTION_STRING=@PROD_PRISMA_POSTGRES_CONNECTION_STRING,MONGODB_USERNAME=@PROD_MONGODB_USERNAME,MONGODB_PASSWORD=@PROD_MONGODB_PASSWORD,MONGODB_URI=@PROD_MONGODB_URI,TELEGRAM_BOT_API_KEY=@PROD_TELEGRAM_BOT_API_KEY,FRONT_WEB_APP_ORIGIN_URL="${{ vars.FRONT_WEB_APP_ORIGIN_URL }}",SESSION_SECRET=@PROD_SESSION_SECRET,STRIPE_API_KEY=@PROD_STRIPE_API_KEY,STRIPE_WEBHOOK_SECRET=@STRIPE_WEBHOOK_SECRET,VALKEY_CACHE_HOST="${{ vars.VALKEY_CACHE_HOST }}",VALKEY_CACHE_PORT="${{ vars.VALKEY_CACHE_PORT }}, AWS_ACCESS_KEY_ID="${{ vars.AWS_ACCESS_KEY_ID}}, AWS_SECRET_ACCESS_KEY=@AWS_SECRET_ACCESS_KEY"

                    app-name: "server-docker"
                    service-instance-type: "nano" #https://www.koyeb.com/docs/reference/instances
                    service-name: "server-docker-latest"
                    service-ports: "3000:http"
                    service-routes: "/:3000"
                    service-regions: "fra" # https://www.koyeb.com/docs/reference/regions
                    docker: "sergion14/uxmonkeys:server-latest"
                    docker-private-registry-secret: "SNR" # MANAGED in https://app.koyeb.com/settings/registry-configuration
                    docker-command: "./start.sh"
                    